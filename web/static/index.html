<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>mail-bridge</title>
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <div class="container">
      <h1>mail-bridge</h1>
      <div id="dash"></div>
      <hr />
      <div id="wizard">
        <h2>Adaugă cont</h2>
        <div>
          <label>Provider
            <select id="w-provider"></select>
          </label>
        </div>
        <div>
          <label>Label <input id="w-label" placeholder="ex. m365-alt" /></label>
        </div>
        <div>
          <label>Email <input id="w-email" placeholder="user@example.com" /></label>
        </div>
        <div>
          <button id="w-create">Creează și înrolează</button>
        </div>
        <div id="w-help" class="help"></div>
      </div>
    </div>
    <script src="/static/main.js"></script>
  </body>
  </html>
